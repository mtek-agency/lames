# Développement : le front dans un conteneur, avec rechargement à chaud.
# Le back-end est l'API Studio (dépôt `studio`, `docker compose up -d` + `make run` dans api/),
# jointe depuis le conteneur par l'hôte. Le site `couteaux` doit exister (migration 00012).
services:
  front:
    build:
      context: ./front
      target: dev
    container_name: knife-front
    restart: unless-stopped
    environment:
      - NUXT_STUDIO_API_URL=${NUXT_STUDIO_API_URL:-http://host.docker.internal:8080}
      - NUXT_STUDIO_SITE=${NUXT_STUDIO_SITE:-couteaux}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 3000 est déjà pris sur l'hôte par un autre projet local -> 3001.
      - "3001:3000"
    volumes:
      - ./front:/app
      # Volumes nommés pour ne pas se faire écraser par le bind mount ci-dessus
      # (binaires natifs linux du conteneur vs macOS/host).
      - front_node_modules:/app/node_modules
      - front_nuxt:/app/.nuxt

volumes:
  front_node_modules:
  front_nuxt:
