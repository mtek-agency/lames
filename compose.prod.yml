# Production (Dokploy) : l'image est construite et publiée par la CI, ce fichier ne fait que la lancer.
# Le back-end est l'API Studio (autre service Dokploy) ; les photos sont servies par son domaine média.
services:
  front:
    # Étiquette immuable (SHA court ou semver) : pour revenir en arrière, changer IMAGE_TAG et redéployer.
    image: ghcr.io/mtek-agency/knife-front:${IMAGE_TAG:-latest}
    # `docker compose up` ne re-pull jamais une image dont le tag existe déjà en local (Dokploy ne fait
    # qu'un `up -d`, pas de `pull` explicite) : sans ça, `latest` ne se met jamais à jour après le
    # premier déploiement.
    pull_policy: always
    container_name: knife-front
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NUXT_STUDIO_API_URL=${NUXT_STUDIO_API_URL:?NUXT_STUDIO_API_URL is required}
      - NUXT_STUDIO_SITE=${NUXT_STUDIO_SITE:-couteaux}
    # Pas de port publié : Traefik (Dokploy) atteint le conteneur par le réseau Docker (domaine dans Dokploy).
    expose:
      - "3000"
    networks:
      - dokploy-network

# Réseau créé par Dokploy : le front y joint l'API Studio directement (NUXT_STUDIO_API_URL=http://studio-api:8080),
# pour que l'IP du visiteur ne se perde pas (voir TRUSTED_PROXIES côté API).
networks:
  dokploy-network:
    external: true
