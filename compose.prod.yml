services:
  pocketbase:
    # Image immuable publiée par la CI (SHA court ou semver) — jamais `latest`
    # seul en prod réelle, pour pouvoir rollback en changeant IMAGE_TAG (§3.1 CDCF).
    image: ghcr.io/mtek-agency/knife-pocketbase:${IMAGE_TAG:-latest}
    # `docker compose up` ne re-pull jamais une image dont le tag existe déjà
    # en local (Dokploy ne fait qu'un `up -d --build`, pas de `pull` explicite) :
    # sans ça, un `IMAGE_TAG` flottant comme `latest` ne se met jamais à jour
    # après le tout premier déploiement, quel que soit le nombre de redeploys.
    pull_policy: always
    container_name: knife-pocketbase
    restart: unless-stopped
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:?PB_ENCRYPTION_KEY is required}
      # Litestream (§7.3) : à renseigner une fois les buckets R2 créés (Jalon 1,
      # bloqué côté Cloudflare) ; sans elles PocketBase démarre sans réplication.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_BACKUP_BUCKET=${R2_BACKUP_BUCKET:-}
      - R2_BACKUP_ACCESS_KEY_ID=${R2_BACKUP_ACCESS_KEY_ID:-}
      - R2_BACKUP_SECRET_ACCESS_KEY=${R2_BACKUP_SECRET_ACCESS_KEY:-}
    # Pas de port publié : en prod, seul Traefik atteint PocketBase via le
    # réseau interne (§3.2 CDCF). PocketBase n'écoute sur aucune IP publique.
    volumes:
      - pb_data:/pb/pb_data
    networks:
      - knife-internal

  front:
    image: ghcr.io/mtek-agency/knife-front:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: knife-front
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NUXT_POCKETBASE_INTERNAL_URL=http://knife-pocketbase:8090
      - NUXT_PUBLIC_MEDIA_BASE_URL=${NUXT_PUBLIC_MEDIA_BASE_URL:?NUXT_PUBLIC_MEDIA_BASE_URL is required}
      # Fond de carte MapTiler (§8 Jalon 5) : sans clé, la carte affiche un
      # message d'erreur explicite au lieu de planter.
      - NUXT_PUBLIC_MAPTILER_KEY=${NUXT_PUBLIC_MAPTILER_KEY:-}
      - NUXT_PUBLIC_MAPTILER_STYLE=${NUXT_PUBLIC_MAPTILER_STYLE:-streets-v2}
    depends_on:
      - pocketbase
    networks:
      - knife-internal

networks:
  knife-internal:
    name: knife-internal

volumes:
  pb_data:
